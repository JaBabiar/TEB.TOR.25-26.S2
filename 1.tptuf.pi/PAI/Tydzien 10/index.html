<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
        }
        #top-nav{
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 75px;
            background-color: #fefefe;
            box-shadow: 0px 10px 10px 0px #00000067;
            /* box-shadow: 
                [przemieszczenie w prawo]
                [przemieszczenie w dół]
                [blur (zamazanie)]
                [spread (Rozproszenie)]
                [kolor]
            */
            transition: all 0.3s ease-in-out;
        }
        #top-nav.sticked{
            height: 50px;
        }
        section{
            background: #d3d3d3;
            margin-top: 75px;
            padding: 20px;
            height: 300vh;
        }
    </style>
</head>
<body>
    <header id="top-nav">

    </header>
    <section>
        lorem
    </section>
</body>
</html>
<script src="./app.js"></script>
