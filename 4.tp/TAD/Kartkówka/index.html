<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wizualizacja GUI - Rejestracja Pojazdu</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e8e8e8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .qt-window {
            background-color: #f0f0f0;
            border: 1px solid #a0a0a0;
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            width: 350px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .window-title-bar {
            background-color: #fff;
            padding: 6px 12px;
            border-bottom: 1px solid #ccc;
            font-size: 12px;
            color: #333;
            margin: -20px -20px 15px -20px;
            border-radius: 6px 6px 0 0;
            user-select: none;
        }
        .title-label {
            text-align: center;
            font-size: 1.25rem;
            font-weight: bold;
            color: #000;
            margin: 0;
        }
        .form-layout {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 12px 10px;
            align-items: center;
        }
        .form-layout label {
            color: #000;
            font-size: 14px;
        }
        .form-layout input {
            padding: 6px;
            border: 1px solid #767676;
            border-radius: 3px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
            background-color: #fff;
        }
        .form-layout input:focus {
            outline: 2px solid #005fcc;
            outline-offset: 1px;
        }
        .button-layout {
            display: flex;
            gap: 10px;
            /* Symulacja układu: wyrównanie do lewej (z prawej jest "spacer") */
            justify-content: flex-start; 
        }
        .btn {
            padding: 6px 20px;
            border: 1px solid #767676;
            background-color: #e1e1e1;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            color: #000;
        }
        .btn:hover {
            background-color: #d4d4d4;
        }
        .btn:focus {
            outline: 2px solid #005fcc;
            outline-offset: 1px;
        }
    </style>
</head>
<body>
    <div class="qt-window" role="dialog" aria-labelledby="form-title">
        <div class="window-title-bar">MainWindow</div>
        
        <h1 id="form-title" class="title-label">Rejestracja Pojazdu</h1>
        
        <div class="form-layout">
            <label for="brand">Marka:</label>
            <input type="text" id="brand" name="brand" aria-required="true">
            
            <label for="model">Model:</label>
            <input type="text" id="model" name="model" aria-required="true">
            
            <label for="year">Rok produkcji:</label>
            <!-- W Qt Designer SpinBox posiada strzałki góra/dół, input type="number" świetnie to symuluje -->
            <input type="number" id="year" name="year" value="2015" step="1">
        </div>
        
        <div class="button-layout">
            <button class="btn" type="button">Dodaj</button>
            <button class="btn" type="button">Wyczyść</button>
            <!-- Miejsce po prawej stornie od przycisków odpowiada wstawionemu Horizontal Spacerowi -->
        </div>
    </div>
</body>
</html>
