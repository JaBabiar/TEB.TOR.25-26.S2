<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
        }
        body{
            font-family: 'Segoe UI';
        }
        form{
            width: 67%;
            min-width: 300px;
            max-width: 450px;
            margin: 0 auto;
            padding: 12px;
            box-shadow: 5px 5px 50px 25px #00000067;
            border-radius: 10px;
        }
        label, input,button{
            display: block;
            width: 100%;
            font-size: 1.5rem;
        }

        label{
            margin-bottom: .5em;
        }


    </style>
</head>
<body>
    <!--form>(label+input:text)*2+button-->
    <form>
        <label for="login">Login: </label>
        <input type="text" name="login" id="login">

        <label for="pwd">Password: </label>
        <input type="password" name="pwd" id="pwd">

        <button type="submit">Login</button>
    </form>
</body>
</html>
