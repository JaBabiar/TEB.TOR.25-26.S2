<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamiczne Stylowanie Bloku HTML</title>
    <style>
        section{
            width: 100%;
            height: 400vh;
        }
        #top{
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background-color: #fefefe;
            box-shadow: 0px 10px 20px #222;
        }

        #top.sticky{
            height: 30px;
        }
    </style>
</head>
<body>
    <header id="top">

    </header>
    <div id="blokStylowy">

    </div>
    <section>

    </section>
</body>
</html>
