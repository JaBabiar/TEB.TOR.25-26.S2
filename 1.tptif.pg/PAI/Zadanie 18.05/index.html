<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Wybór Bohatera - LoL</title>
    <style>
        body { font-family: sans-serif; background-color: #111; color: #fff; text-align: center; }
        
        .roster { 
            margin: 20px; 
            display: flex; 
            justify-content: center; 
            gap: 15px; 
        }
        
       
        .champ-btn { 
            background: none; 
            border: 2px solid transparent; 
            padding: 0; 
            cursor: pointer; 
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
        }
        
        .champ-btn:hover, .champ-btn:focus { 
            transform: scale(1.1); 
            border-color: #c8aa6e; 
            outline: none;
        }

        .champ-btn img {
            display: block;
            width: 80px; /* Rozmiar małych ikonek */
            height: 80px;
        }

        #champ-splash { 
            max-height: 400px; 
            border-radius: 10px; 
            display: none; 
            margin: 20px auto; 
            border: 3px solid #c8aa6e;
        }
    </style>
</head>
<body>

    <div class="roster">
        <button class="champ-btn" 
                data-name="Corki" 
                data-title="Wystrzałowa Wariatka" 
                data-image="https://ddragon.leagueoflegends.com/cdn/img/champion/loading/Corki_2.jpg"
                data-audio="./Corki.wybór.ogg"
                aria-label="Wybierz postać Corki">
            <img src="https://ddragon.leagueoflegends.com/cdn/14.8.1/img/champion/Corki.png" alt="Ikona Corki">
        </button>
        
        <button class="champ-btn" 
                data-name="Yasuo" 
                data-title="Pokutnik" 
                data-image="https://ddragon.leagueoflegends.com/cdn/img/champion/loading/Yasuo_1.jpg"
                aria-label="Wybierz postać Yasuo">
            <img src="https://ddragon.leagueoflegends.com/cdn/14.8.1/img/champion/Yasuo.png" alt="Ikona Yasuo">
        </button>

        <button class="champ-btn" 
                data-name="jax" 
                data-title="Dziewięcioogoniasta Lisica" 
                data-image="https://ddragon.leagueoflegends.com/cdn/img/champion/loading/Jax_3.jpg"
                aria-label="Wybierz postać Ahri">
            <img src="https://ddragon.leagueoflegends.com/cdn/14.8.1/img/champion/Jax.png" alt="Ikona Ahri">
        </button>

        <button class="champ-btn" 
                data-name="Akali" 
                data-title="Nozofnik" 
                data-image="https://ddragon.leagueoflegends.com/cdn/img/champion/loading/Akali_0.jpg"
                aria-label="Wybierz postać Akali">
            <img src="https://ddragon.leagueoflegends.com/cdn/14.8.1/img/champion/Akali.png" alt="Ikona Akali">
        </button>
    </div>

    <div class="display-panel">
        <h1 id="selected-name">Wybierz swojego bohatera</h1>
        <h3 id="selected-title" style="color: #c8aa6e;">---</h3>
        <img id="champ-splash" src="" alt="Portret wybranego bohatera">
    </div>

</body>
</html>

<script src="./app.js"></script>
